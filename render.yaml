services:
  - type: web
    name: daybook-expense-tracker
    runtime: node
    plan: free
    buildCommand: npm install && npm install --prefix server && npm install --prefix client && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: APP_PASSWORD
        sync: false
